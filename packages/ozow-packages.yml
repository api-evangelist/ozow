source: >-
  npm, GitHub, and Packagist searches for Ozow client libraries. Ozow publishes
  no first-party SDK; it documents HTTP form-post / JS-injection / direct-API
  integration and 14 e-commerce plugins (Shopify, WooCommerce, Magento,
  BigCommerce, PrestaShop, OpenCart, CS-Cart, WP eCommerce, Xero, NopCommerce,
  VirtueMart, WHMCS, J2 Store, Drupal) via https://ozow.com/integrations. All
  code libraries below are community-maintained; none is official (official:
  false everywhere).
