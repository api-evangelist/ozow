description: >-
  FinOps view of Ozow merchant costs. Ozow charges a percentage fee per
  successful transaction in ZAR, tiered by transaction value, with no monthly
  subscription or setup fees and a R1.00 per-transaction minimum. Cost is
  therefore a function of successful payment volume and value mix, plus any
  fees for additional products (Refunds, Payouts, POS, e-Commerce, QR).
notes: >-
  Percentage tiers change; verify against the Ozow pricing page and the
  merchant agreement during reconciliation. Costs are settlement/merchant
  fees, not API metering.
sources:
