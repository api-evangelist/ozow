meters:
- name: transaction_fee
  description: Percentage fee charged per successful EFT transaction, tiered by value band (min R1.00).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - site
  - value_band
- name: refund_volume
  description: Refunds disbursed from the merchant Ozow float (may carry a product fee).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - site
- name: payout_volume
  description: Payouts disbursed to recipients (may carry a product fee).
  unit: transactions
  aggregation: sum
  dimensions:
  - merchant
  - site
principles:
- name: Visibility
  description: Pull Ozow settlement statements; track effective fee rate by value band and product.
- name: Allocation
  description: Tag transactions per site/SiteCode and reference to map fees to internal cost centers.
- name: Optimization
  description: Route higher-value transactions to benefit from lower tiers; negotiate volume rates; minimise reversals/refunds.
- name: Accountability
  description: Reconcile NotifyUrl notifications against settlements monthly; assign an owner per merchant site.
